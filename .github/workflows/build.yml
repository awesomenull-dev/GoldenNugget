name: Build Nugget

on:
  workflow_dispatch:
    inputs:
      build_for_macos_intel:
        description: 'Build macOS Intel'
        required: false
        default: true
        type: boolean
      build_for_macos_arm:
        description: 'Build macOS ARM'
        required: false
        default: true
        type: boolean
      build_for_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_for_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean
      build_for_arm_linux:
        description: 'Build Linux ARM'
        required: false
        default: true
        type: boolean
  push:
    branches: [main, release]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-macos-intel:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_macos_intel == 'true' }}
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Create venv and install requirements
        run: |
          python3 -m venv .env
          source .env/bin/activate
          python -m pip install -U pip setuptools wheel
          pip install --no-binary sslpsk_pmd3 -r requirements.txt

      - name: Build macOS Intel
        run: |
          source .env/bin/activate
          python3 compile.py

      - name: Upload macOS Intel
        uses: actions/upload-artifact@v6
        with:
          name: Nugget_macOS_intel
          path: dist/Nugget.app
          if-no-files-found: error

  build-macos-arm:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_macos_arm == 'true' }}
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install OpenSSL
        run: |
          brew install openssl@3 pkgconf || true

      - name: Create venv and install requirements
        run: |
          python3 -m venv .env
          source .env/bin/activate
          python -m pip install -U pip setuptools wheel

          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          export CPPFLAGS="-I${OPENSSL_PREFIX}/include"
          export LDFLAGS="-L${OPENSSL_PREFIX}/lib"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig"

          pip install --no-binary sslpsk_pmd3 -r requirements.txt

      - name: Build macOS ARM
        run: |
          source .env/bin/activate
          python3 compile.py

      - name: Upload macOS ARM
        uses: actions/upload-artifact@v6
        with:
          name: Nugget_macOS_arm
          path: dist/Nugget.app
          if-no-files-found: error

  build-windows:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_windows == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r requirements.txt
          pip install pyuac

      - name: Build Windows
        run: python compile.py

      - name: Upload Windows
        uses: actions/upload-artifact@v6
        with:
          name: Nugget_Windows
          path: dist/Nugget
          if-no-files-found: error

  build-linux:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_linux == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r requirements.txt

      - name: Build Linux
        run: python compile.py

      - name: Upload Linux
        uses: actions/upload-artifact@v6
        with:
          name: Nugget_Linux
          path: dist/Nugget
          if-no-files-found: error

  build-linux-arm:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_arm_linux == 'true' }}
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r requirements.txt

      - name: Build Linux ARM
        run: python compile.py

      - name: Upload Linux ARM
        uses: actions/upload-artifact@v6
        with:
          name: Nugget_Linux_aarch64
          path: dist/Nugget
          if-no-files-found: error

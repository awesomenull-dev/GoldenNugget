name: Sync Translations from gNugget-i18n

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday 3 AM UTC
  repository_dispatch:
    types: [translations-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GoldenNugget with submodules
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6

      - name: Update i18n submodule to latest
        run: |
          git submodule update --remote --merge i18n

      # The .ts/.qm files are NOT kept in this repository — gNugget-i18n is the
      # single source of truth. Each run copies the fresh sources, compiles them
      # and bakes the result into resources_rc.py (embedded Qt resources), which
      # is the only translation artifact that gets committed.
      - name: Refresh translation sources from submodule
        run: |
          mkdir -p src/qt/translations
          cp -f i18n/Nugget_*.ts src/qt/translations/

      - name: Compile translations
        run: |
          cd src/qt/translations
          for f in *.ts; do
            [ -f "$f" ] || continue
            pyside6-lrelease "$f" -qm "${f%.ts}.qm"
          done

      - name: Regenerate resources_rc.py
        run: |
          cd src/qt
          pyside6-rcc resources.qrc -o resources_rc.py

      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet src/qt/resources_rc.py; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push resources_rc.py
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n src/qt/resources_rc.py
          git commit -m "chore: sync translations and bump i18n submodule"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
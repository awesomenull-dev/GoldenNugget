<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200">
  <!-- iOS-style: New UI Home — nav bar + card grid -->
  <g>
    <!-- window frame -->
    <rect x="8" y="6" width="344" height="188" rx="10" fill="none" stroke="#8E8E93" stroke-width="2"/>
  </g>

  <!-- navigation bar -->
  <g>
    <rect x="16" y="16" width="328" height="30" rx="6" fill="none" stroke="#8E8E93" stroke-width="2"/>
    <!-- back chevron (left) -->
    <path d="M30 31 H44 M30 31 L34 27 M30 31 L34 35" stroke="#E5E5EA" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- title (center) -->
    <rect x="150" y="26" width="60" height="10" rx="5" fill="#E5E5EA"/>
    <!-- action (right) -->
    <circle cx="316" cy="31" r="7" fill="none" stroke="#E5E5EA" stroke-width="2"/>
  </g>

  <!-- page heading -->
  <rect x="20" y="58" width="84" height="10" rx="5" fill="#E5E5EA"/>

  <!-- cards row 1 -->
  <g>
    <rect x="20" y="76" width="154" height="54" rx="9" fill="none" stroke="#8E8E93" stroke-width="2"/>
    <rect x="28" y="84" width="76" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="28" y="99" width="120" height="6" rx="3" fill="#8E8E93"/>
    <rect x="28" y="111" width="96" height="6" rx="3" fill="#8E8E93"/>

    <rect x="186" y="76" width="154" height="54" rx="9" fill="none" stroke="#8E8E93" stroke-width="2"/>
    <rect x="194" y="84" width="76" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="194" y="99" width="120" height="6" rx="3" fill="#8E8E93"/>
    <rect x="194" y="111" width="96" height="6" rx="3" fill="#8E8E93"/>
  </g>

  <!-- cards row 2 -->
  <g>
    <rect x="20" y="138" width="154" height="48" rx="9" fill="none" stroke="#8E8E93" stroke-width="2"/>
    <rect x="28" y="148" width="76" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="28" y="163" width="110" height="6" rx="3" fill="#8E8E93"/>

    <rect x="186" y="138" width="154" height="48" rx="9" fill="none" stroke="#8E8E93" stroke-width="2"/>
    <rect x="194" y="148" width="76" height="8" rx="4" fill="#E5E5EA"/>
    <rect x="194" y="163" width="110" height="6" rx="3" fill="#8E8E93"/>
  </g>
</svg>
